name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The matrix axis is PHP version rather than anything else: proving that current
        # syntax is still understood is the standing regression guard on the decision to own
        # this engine, and a fixture is the only thing that would tell us if it lapsed.
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: shivammathur/setup-php@0f7f1d08e3e32076e51cae65eb0b0c871405b16e # v2.34.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --no-interaction --prefer-dist --no-progress

      - run: composer test
